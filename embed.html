<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Embed</title>
  <!--
    NOTE: This static page is a fallback for direct browser visits.
    Discord's link unfurler does not run JavaScript, so it reads meta
    tags from the raw HTML response only — this page's dynamic title
    below won't affect how the link unfurls in Discord. The actual
    Discord embed (og:title/og:description) is generated by the
    Cloudflare Worker in front of this site at /embed/<text>, which
    injects those tags server-side per request. See worker.js.
  -->
  <style>
    :root {
      --bg: #23272a;
      --sidebar-bg: #1e1f22;
      --sidebar-border: #2b2d31;
      --hover: #2b2d31;
      --active: #5865F2;
      --active-hover: #4752C4;
      --text: #dbdee1;
      --text-muted: #949ba4;
      --error: #f2555a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
    }

    .sidebar {
      width: 220px;
      flex-shrink: 0;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--sidebar-border);
      padding: 20px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .sidebar-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 0 8px 8px;
    }

    .sidebar-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .sidebar-link {
      display: block;
      padding: 8px 10px;
      border-radius: 6px;
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .sidebar-link:hover {
      background: var(--hover);
    }

    .sidebar-link.active {
      background: var(--active);
      color: #ffffff;
    }

    .sidebar-status {
      font-size: 13px;
      color: var(--text-muted);
      padding: 8px;
      list-style: none;
    }

    .sidebar-status.error {
      color: var(--error);
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .embed-card {
      max-width: 560px;
      text-align: center;
    }

    .embed-label {
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .embed-text {
      font-size: 24px;
      font-weight: 600;
      word-break: break-word;
    }

    .embed-note {
      margin-top: 18px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .site-footnote {
      position: fixed;
      bottom: 6px;
      right: 10px;
      font-size: 10px;
      color: var(--text-muted);
      opacity: 0.6;
    }

    @media (max-width: 700px) {
      body { flex-direction: column; }
      .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid var(--sidebar-border);
      }
      .sidebar-list {
        flex-direction: row;
        flex-wrap: wrap;
      }
      .sidebar-link {
        white-space: normal;
      }
    }
  </style>
</head>
<body>

  <nav class="sidebar" aria-label="Site pages">
    <div class="sidebar-label">Pages</div>
    <ul class="sidebar-list" id="page-list">
      <li class="sidebar-status" id="page-status">Loading pages…</li>
    </ul>
  </nav>

  <main>
    <div class="embed-card">
      <div class="embed-label">woopsite</div>
      <div class="embed-text" id="embed-text">…</div>
      <div class="embed-note">This page's Discord embed preview is generated by a Cloudflare Worker, not by this static page.</div>
    </div>
  </main>

  <p class="site-footnote">This site pings a Discord webhook on load and uses a third-party counter (countapi.mileshilliard.com) to detect traffic bursts.</p>

  <script>
    // ---- Parse /embed/<text> from the path ----
    function getEmbedTextFromPath() {
      const parts = window.location.pathname.split("/").filter(Boolean);
      const idx = parts.findIndex((p) => p.toLowerCase() === "embed");
      if (idx === -1 || idx === parts.length - 1) return null;
      // Support multi-segment text (in case slashes weren't encoded) by
      // joining everything after "embed".
      const raw = parts.slice(idx + 1).join("/");
      try {
        return decodeURIComponent(raw);
      } catch {
        return raw;
      }
    }

    const embedText = getEmbedTextFromPath();
    const textEl = document.getElementById("embed-text");
    if (embedText) {
      textEl.textContent = embedText;
      document.title = embedText;
    } else {
      textEl.textContent = "No text provided.";
    }

    // ---- Configure these two lines for your repo ----
    const GITHUB_OWNER = "0coolwoopet";
    const GITHUB_REPO = "woopsite";
    const GITHUB_BRANCH = "main";
    // ---------------------------------------------------

    function titleFromFilename(filename) {
      const name = filename.replace(/\.html$/i, "");
      if (name.toLowerCase() === "index") return "Home";
      return name
        .replace(/[-_]+/g, " ")
        .replace(/\b\w/g, (c) => c.toUpperCase());
    }

    async function fetchPageTitle(filename) {
      const rawUrl = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${filename}`;
      try {
        const res = await fetch(rawUrl);
        if (!res.ok) throw new Error(`raw fetch ${res.status}`);
        const html = await res.text();
        const match = html.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
        const title = match && match[1].trim();
        return title || titleFromFilename(filename);
      } catch (err) {
        console.error(`Couldn't read <title> for ${filename}:`, err);
        return titleFromFilename(filename);
      }
    }

    async function loadPages() {
      const listEl = document.getElementById("page-list");
      const statusEl = document.getElementById("page-status");
      const apiUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/?ref=${GITHUB_BRANCH}`;

      try {
        const res = await fetch(apiUrl, {
          headers: { Accept: "application/vnd.github+json" }
        });

        if (!res.ok) {
          throw new Error(`GitHub API responded ${res.status}`);
        }

        const items = await res.json();

        const pages = items
          .filter((item) => item.type === "file" && /\.html$/i.test(item.name))
          .sort((a, b) => {
            if (a.name.toLowerCase() === "index.html") return -1;
            if (b.name.toLowerCase() === "index.html") return 1;
            return a.name.localeCompare(b.name);
          });

        if (pages.length === 0) {
          statusEl.textContent = "No pages found.";
          return;
        }

        statusEl.remove();

        const currentFile = window.location.pathname.split("/").pop() || "index.html";

        const titles = await Promise.all(
          pages.map((page) => fetchPageTitle(page.name))
        );

        pages.forEach((page, i) => {
          const li = document.createElement("li");
          const a = document.createElement("a");
          a.className = "sidebar-link";
          a.href = page.name;
          a.textContent = titles[i];
          if (page.name.toLowerCase() === currentFile.toLowerCase()) {
            a.classList.add("active");
          }
          li.appendChild(a);
          listEl.appendChild(li);
        });
      } catch (err) {
        statusEl.textContent = "Couldn't load pages.";
        statusEl.classList.add("error");
        console.error("Sidebar page list failed to load:", err);
      }
    }

    loadPages();
  </script>

</body>
</html>
